<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>CHAOS CLUB</title>
<meta name="description" content="CHAOS CLUB — משחקים לכל המשפחה">
<meta name="theme-color" content="#08080f">
<meta property="og:type" content="website">
<meta property="og:site_name" content="CHAOS CLUB">
<meta property="og:title" content="CHAOS CLUB">
<meta property="og:description" content="מוח וחידות, משחקי חברה, מוזיקה, יצירתיות, מהירות, סדנת בישול ועוד אינטראקטיביים, ניקוד, מטבעות וחנות. לחיצה אחת ומתחילים.">
<meta property="og:locale" content="he_IL">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="CHAOS CLUB">
<meta name="twitter:description" content="משחקים לכל המשפחה — ניקוד, מטבעות וחנות, ישר בדפדפן.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08080f;
  --bg2:#0e0e1c;
  --panel:rgba(255,255,255,.045);
  --panel2:rgba(255,255,255,.075);
  --line:rgba(255,255,255,.10);
  --txt:#f2f1ff;
  --dim:#a29fbd;
  --brain:#8b5cf6;
  --party:#ff4d8d;
  --music:#ffb020;
  --create:#22d3a5;
  --speed:#ff6b3d;
  --ok:#2ee6a8;
  --bad:#ff5470;
  --radius:22px;
  --shadow:0 18px 50px rgba(0,0,0,.55);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Heebo','Assistant',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg);
  color:var(--txt);
  direction:rtl;
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(900px 600px at 85% -10%, rgba(139,92,246,.28), transparent 60%),
    radial-gradient(800px 700px at 5% 10%, rgba(255,77,141,.18), transparent 62%),
    radial-gradient(900px 700px at 50% 110%, rgba(34,211,165,.16), transparent 65%),
    linear-gradient(180deg,#0a0a14,#07070d 60%,#0b0b14);
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.35;
  background-image:radial-gradient(rgba(255,255,255,.12) 1px, transparent 1px);
  background-size:34px 34px;
  mask-image:radial-gradient(circle at 50% 30%,#000,transparent 78%);
  -webkit-mask-image:radial-gradient(circle at 50% 30%,#000,transparent 78%);
}

button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font-family:inherit}

.wrap{max-width:1120px;margin:0 auto;padding:20px 18px 70px}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:12px;padding:14px 18px;position:sticky;top:0;z-index:40;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  background:linear-gradient(180deg,rgba(8,8,15,.92),rgba(8,8,15,.55) 70%,transparent);
}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto}
.logo{font-weight:900;font-size:19px;letter-spacing:1.5px;
  background:linear-gradient(90deg,#fff,#c9b8ff 40%,#ff9ec4 75%,#ffd08a);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 30px rgba(180,140,255,.35)}
.logo small{display:block;font-size:9px;letter-spacing:4px;color:var(--dim);font-weight:600;-webkit-text-fill-color:var(--dim)}
.icon-btn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:18px;
  background:var(--panel);border:1px solid var(--line);transition:.2s;color:var(--txt)}
.icon-btn:hover{background:var(--panel2);transform:translateY(-2px)}
.icon-btn:active{transform:scale(.94)}
.pill{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--txt);white-space:nowrap}
.pill b{color:#ffd08a}

/* ---------- hero ---------- */
.hero{text-align:center;padding:34px 10px 26px;animation:fadeUp .6s both}
.hero h1{margin:0;font-size:clamp(34px,7vw,68px);line-height:.98;font-weight:900;letter-spacing:-1px}
.hero h1 span{display:inline-block;
  background:linear-gradient(100deg,#8b5cf6,#ff4d8d 45%,#ffb020 75%,#22d3a5);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 8px 30px rgba(255,77,141,.35))}
.hero p{color:var(--dim);margin:14px auto 0;max-width:560px;font-size:clamp(14px,2.4vw,17px);line-height:1.6}
.hero-stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 18px;min-width:104px}
.stat b{display:block;font-size:22px;font-weight:900;background:linear-gradient(90deg,#fff,#c9b8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:11px;color:var(--dim);letter-spacing:.5px}

/* ---------- category grid ---------- */
.section-title{display:flex;align-items:center;gap:10px;margin:34px 4px 16px;font-size:15px;font-weight:800;color:var(--dim);letter-spacing:.5px}
.section-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

.cat-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(285px,1fr))}
.cat-card{
  position:relative;overflow:hidden;border-radius:var(--radius);padding:22px;min-height:186px;
  display:flex;flex-direction:column;justify-content:space-between;gap:14px;
  background:linear-gradient(150deg,rgba(255,255,255,.075),rgba(255,255,255,.02));
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  transition:transform .3s cubic-bezier(.2,.9,.3,1.4),box-shadow .3s,border-color .3s;
  animation:fadeUp .55s both;
  text-align:right;
  cursor:pointer;
}
.cat-card::before{
  content:"";position:absolute;inset:-2px;border-radius:inherit;padding:1.5px;
  background:linear-gradient(140deg,var(--c1),transparent 45%,var(--c2));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  opacity:.75;transition:.3s;
}
.cat-card::after{
  content:"";position:absolute;width:230px;height:230px;border-radius:50%;
  background:radial-gradient(circle,var(--c1),transparent 68%);
  filter:blur(28px);opacity:.42;top:-90px;left:-70px;transition:.4s;
}
.cat-card:hover{transform:translateY(-6px) scale(1.012);border-color:transparent}
.cat-card:hover::after{opacity:.72;transform:scale(1.15)}
.cat-card:active{transform:scale(.985)}
.cat-emoji{font-size:40px;line-height:1;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5));transition:.35s}
.cat-card:hover .cat-emoji{transform:scale(1.14) rotate(-6deg)}
.cat-name{font-size:23px;font-weight:900;margin:0;letter-spacing:-.4px}
.cat-sub{font-size:12.5px;color:var(--dim);margin:5px 0 0;line-height:1.45}
.cat-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;position:relative;z-index:2}
.cat-count{font-size:11.5px;font-weight:800;color:var(--c2);background:rgba(255,255,255,.07);
  border:1px solid var(--line);padding:5px 11px;border-radius:999px}
.cat-best{font-size:11.5px;color:var(--dim);font-weight:700}
.cat-go{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--c1),var(--c2));color:#0a0a12;font-weight:900;font-size:16px;
  box-shadow:0 8px 22px -6px var(--c1)}

/* ---------- game cards ---------- */
.game-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-top:18px}
.game-card{
  position:relative;overflow:hidden;border-radius:18px;padding:18px;text-align:right;
  background:linear-gradient(155deg,rgba(255,255,255,.075),rgba(255,255,255,.018));
  border:1px solid var(--line);transition:.28s;animation:fadeUp .5s both;cursor:pointer;
  display:flex;flex-direction:column;gap:10px;min-height:150px;
}
.game-card:hover{transform:translateY(-5px);border-color:var(--c1);box-shadow:0 16px 40px -14px var(--c1)}
.game-card:active{transform:scale(.98)}
.game-card .gc-top{display:flex;align-items:center;gap:10px}
.game-card .gc-emoji{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;
  background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 10px 24px -10px var(--c1);flex:0 0 auto}
.game-card h3{margin:0;font-size:16.5px;font-weight:800;line-height:1.25}
.game-card .gc-desc{margin:0;font-size:12.5px;color:var(--dim);line-height:1.5;flex:1}
.gc-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;font-weight:700}
.gc-best{color:var(--dim)}
.gc-best b{color:#ffd08a}
.gc-play{color:var(--c2);display:flex;align-items:center;gap:5px}
.diff{display:inline-flex;gap:3px}
.diff i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.2)}
.diff i.on{background:var(--c2)}

/* ---------- game screen ---------- */
.game-head{display:flex;align-items:center;gap:12px;padding:8px 4px 16px;flex-wrap:wrap}
.game-head h2{margin:0;font-size:clamp(18px,3.6vw,24px);font-weight:900}
.hud{display:flex;align-items:center;gap:8px;margin-inline-start:auto;flex-wrap:wrap}
.hud .pill{font-size:12.5px;padding:7px 12px}
.hud .pill.score b{font-size:15px}
.timerbar{height:7px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden;margin:0 4px 16px}
.timerbar i{display:block;height:100%;width:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--c1),var(--c2));transition:width .18s linear}
.timerbar.warn i{background:linear-gradient(90deg,#ffb020,#ff5470)}

.stage{position:relative;min-height:330px;border-radius:var(--radius);padding:18px;
  background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.015));
  border:1px solid var(--line);box-shadow:var(--shadow);animation:fadeUp .4s both;overflow:hidden}
.stage.center{display:grid;place-items:center;text-align:center}

/* generic game bits */
.g-title{font-size:15px;font-weight:800;color:var(--dim);text-align:center;margin:0 0 14px}
.g-q{font-size:clamp(22px,5vw,34px);font-weight:900;text-align:center;margin:8px 0 18px;line-height:1.25}
.g-note{font-size:13px;color:var(--dim);text-align:center;line-height:1.5;margin:10px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 22px;border-radius:16px;font-weight:800;font-size:14.5px;
  background:linear-gradient(135deg,var(--c1),var(--c2));color:#08080f;
  box-shadow:0 12px 30px -12px var(--c1);transition:.2s;border:0}
.btn:hover{transform:translateY(-2px);filter:brightness(1.06)}
.btn:active{transform:scale(.96)}
.btn.ghost{background:rgba(255,255,255,.07);color:var(--txt);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:rgba(255,255,255,.12)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.opts{display:grid;gap:10px;grid-template-columns:1fr 1fr;max-width:560px;margin:0 auto}
.opt{padding:15px 12px;border-radius:15px;background:rgba(255,255,255,.06);border:1px solid var(--line);
  font-size:15px;font-weight:700;color:var(--txt);transition:.18s;text-align:center;line-height:1.3}
.opt:hover{background:rgba(255,255,255,.12);transform:translateY(-2px)}
.opt.ok{background:linear-gradient(135deg,#1c6b53,#22d3a5);color:#04120d;border-color:transparent}
.opt.no{background:linear-gradient(135deg,#6b1c33,#ff5470);color:#fff;border-color:transparent}
.opt:disabled{pointer-events:none}
.input{width:100%;max-width:420px;padding:15px 18px;border-radius:15px;font-size:16px;
  background:rgba(0,0,0,.35);border:1.5px solid var(--line);color:var(--txt);outline:none;transition:.2s;text-align:center}
.input:focus{border-color:var(--c1);box-shadow:0 0 0 4px color-mix(in srgb,var(--c1) 22%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:14px;max-height:130px;overflow:auto}
.chip{padding:6px 12px;border-radius:999px;background:rgba(34,230,168,.13);color:#8ef2cf;
  border:1px solid rgba(34,230,168,.32);font-size:12.5px;font-weight:700;animation:pop .25s both}
.chip.dup{background:rgba(255,84,112,.13);color:#ffb3bf;border-color:rgba(255,84,112,.3)}

.countdown{font-size:64px;font-weight:900;text-align:center;
  background:linear-gradient(135deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:pop .5s both}

/* cards / tiles */
.tiles{display:grid;gap:10px;justify-content:center;margin:0 auto}
.tile{aspect-ratio:1;border-radius:14px;display:grid;place-items:center;font-size:clamp(18px,4vw,26px);
  background:rgba(255,255,255,.07);border:1px solid var(--line);transition:transform .18s,background .18s;user-select:none}
.tile:hover{transform:translateY(-2px);background:rgba(255,255,255,.13)}
.tile.face{background:linear-gradient(145deg,var(--c1),var(--c2));color:#08080f}
.tile.done{opacity:.28;pointer-events:none;transform:scale(.94)}
.tile.bad{animation:shake .35s}
.tile.sel{outline:2.5px solid var(--c2);outline-offset:-3px}

.simon-pads{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:330px;margin:0 auto}
.pad{aspect-ratio:1.15;border-radius:20px;transition:.12s;border:2px solid transparent;opacity:.62}
.pad.lit{opacity:1;transform:scale(1.04);box-shadow:0 0 40px 2px currentColor;border-color:rgba(255,255,255,.7)}
.pad:active{transform:scale(.97)}

canvas{display:block;max-width:100%;border-radius:16px;touch-action:none}
.pad-wrap{display:grid;place-items:center}

/* wheel */
.wheel-wrap{display:grid;place-items:center;gap:16px}
#wheel{transition:transform 4.2s cubic-bezier(.16,.84,.3,1)}
.wheel-pointer{font-size:22px;margin-bottom:-10px}

/* ---------- instructions / results ---------- */
.overlay{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:18px;
  background:rgba(6,6,12,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  animation:fadeIn .3s both;overflow:auto}
.sheet{width:100%;max-width:520px;background:linear-gradient(160deg,#17172a,#101020);
  border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow);animation:pop .35s both}
.sheet h3{margin:0 0 4px;font-size:21px;font-weight:900}
.sheet .tag{font-size:11.5px;font-weight:800;color:var(--c2);letter-spacing:.5px;margin-bottom:14px;display:block}
.howto{margin:0 0 18px;padding:0;list-style:none;display:grid;gap:9px}
.howto li{display:flex;gap:10px;font-size:13.5px;color:#d9d6ee;line-height:1.5}
.howto li::before{content:attr(data-n);flex:0 0 21px;height:21px;border-radius:7px;display:grid;place-items:center;
  font-size:11px;font-weight:900;background:linear-gradient(135deg,var(--c1),var(--c2));color:#08080f;margin-top:1px}
.scoring{font-size:12px;color:var(--dim);background:rgba(255,255,255,.05);border-radius:12px;padding:10px 13px;margin-bottom:16px;line-height:1.5}

.result{text-align:center;animation:pop .45s both}
.result .medal{font-size:58px;line-height:1;animation:floaty 2.4s ease-in-out infinite}
.result h3{margin:6px 0 0;font-size:24px;font-weight:900}
.big-score{font-size:64px;font-weight:900;line-height:1;margin:10px 0 4px;
  background:linear-gradient(135deg,#fff,var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.result .sub{color:var(--dim);font-size:13px;margin-bottom:6px}
.newbest{display:inline-block;margin:8px 0 0;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:900;
  background:linear-gradient(135deg,#ffd08a,#ff9ec4);color:#1a0f00;animation:pulseGlow 1.6s infinite}
.res-actions{display:grid;gap:9px;margin-top:18px}

/* toast + confetti */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);z-index:99;
  padding:12px 22px;border-radius:14px;background:rgba(24,24,40,.96);border:1px solid var(--line);
  font-size:13.5px;font-weight:800;opacity:0;transition:.3s;pointer-events:none;box-shadow:var(--shadow);max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.confetti{position:fixed;width:9px;height:9px;border-radius:2px;z-index:98;pointer-events:none}

/* animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.86)}60%{transform:scale(1.03)}100%{opacity:1;transform:scale(1)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(255,208,138,.5)}50%{box-shadow:0 0 0 12px rgba(255,208,138,0)}}
@keyframes scoreFly{0%{opacity:0;transform:translateY(6px) scale(.8)}30%{opacity:1;transform:translateY(-6px) scale(1.1)}100%{opacity:0;transform:translateY(-30px) scale(1)}}
.floatscore{position:fixed;z-index:97;font-weight:900;font-size:20px;color:#2ee6a8;pointer-events:none;animation:scoreFly .9s both;text-shadow:0 4px 16px rgba(0,0,0,.6)}
@keyframes flashBg{0%{background-color:rgba(255,84,112,.28)}100%{background-color:transparent}}
.flashbad{animation:flashBg .45s both}

@media(max-width:600px){
  .wrap{padding:14px 12px 60px}
  .stage{padding:13px}
  .opts{grid-template-columns:1fr}
  .cat-card{min-height:160px;padding:18px}
  .logo{font-size:16px}
  .hud .pill{font-size:11.5px;padding:6px 10px}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

/* ---------- light / day theme ---------- */
html[data-theme="light"]{
  --bg:#f4f2fb; --bg2:#ffffff;
  --panel:rgba(20,16,50,.045); --panel2:rgba(20,16,50,.08);
  --line:rgba(20,16,50,.12);
  --txt:#17142b; --dim:#655f85;
  --shadow:0 18px 44px rgba(50,30,110,.14);
}
html[data-theme="light"] body{background:#f4f2fb}
html[data-theme="light"] body::before{
  background:
    radial-gradient(900px 600px at 85% -10%, rgba(139,92,246,.18), transparent 60%),
    radial-gradient(800px 700px at 5% 10%, rgba(255,77,141,.14), transparent 62%),
    radial-gradient(900px 700px at 50% 110%, rgba(34,211,165,.13), transparent 65%),
    linear-gradient(180deg,#f7f5ff,#efeafd 60%,#f6f3ff);
}
html[data-theme="light"] body::after{opacity:.5;background-image:radial-gradient(rgba(20,16,50,.10) 1px, transparent 1px)}
html[data-theme="light"] .logo{background:linear-gradient(90deg,#2b1d6b,#7c3aed 40%,#e0367a 75%,#d98a10);-webkit-background-clip:text;background-clip:text}
html[data-theme="light"] .topbar{background:linear-gradient(180deg,rgba(248,246,255,.94),rgba(248,246,255,.5) 70%,transparent)}
html[data-theme="light"] .cat-card,html[data-theme="light"] .game-card{background:linear-gradient(150deg,#ffffff,#f3f0ff);box-shadow:var(--shadow)}
html[data-theme="light"] .stage{background:linear-gradient(160deg,#ffffff,#f6f3ff)}
html[data-theme="light"] .stat b{background:linear-gradient(90deg,#2b1d6b,#7c3aed);-webkit-background-clip:text;background-clip:text}
html[data-theme="light"] .big-score{background:linear-gradient(135deg,#2b1d6b,var(--c1));-webkit-background-clip:text;background-clip:text}
html[data-theme="light"] .sheet{background:linear-gradient(160deg,#ffffff,#f6f3ff)}
html[data-theme="light"] .overlay{background:rgba(245,243,255,.86)}
html[data-theme="light"] .opt{background:rgba(20,16,50,.055)}
html[data-theme="light"] .opt:hover{background:rgba(20,16,50,.1)}
html[data-theme="light"] .tile{background:rgba(20,16,50,.07)}
html[data-theme="light"] .input{background:#fff;color:var(--txt)}
html[data-theme="light"] .btn.ghost{background:rgba(20,16,50,.07)}
html[data-theme="light"] #toast{background:#fff;color:#17142b}

    addLives(n) { S.lives = Math.max(0, (S.lives || 0) + n); persist(); },

/* ---------- מוזיקת רקע ---------- */
const Music = (() => {
  const BPM = 92, BEAT = 60 / BPM;
  const CHORDS = [[220.00,261.63,329.63],[174.61,220.00,261.63],[261.63,329.63,392.00],[196.00,246.94,293.66]];
  let timer = null, step = 0;
  function bar() {
    const c = Sound.ctx && Sound.ctx();
    if (!c) return;
    const t0 = c.currentTime + .06;
    const ch = CHORDS[step % CHORDS.length];
    Sound.noteAt(ch[0] / 2, t0, BEAT * 3.4, 'sine', .13);
    Sound.chordAt(ch, t0, BEAT * 3.1, .042);
    ch.forEach((f, i) => Sound.noteAt(f * 2, t0 + i * BEAT, .3, 'sine', .05));
    for (let i = 0; i < 4; i++) Sound.hatAt(t0 + i * BEAT + BEAT / 2);
    Sound.kickAt(t0);
    Sound.kickAt(t0 + BEAT * 2);
    step++;
  }
  return {
    isOn() { return !!timer; },
    start() {
      if (timer || Store.muted()) return false;
      Sound.unlock();
      step = 0; bar();
      timer = setInterval(bar, BEAT * 4 * 1000);
      return true;
    },
    stop() { if (timer) { clearInterval(timer); timer = null; } },
    toggle() { if (this.isOn()) { this.stop(); return false; } return this.start(); }
  };
})();

/* ---------- generic quiz runner ---------- */
function runQuiz(api, cfg) {
  // cfg: {count, make(i) -> {q, sub, options:[..], answer:index, pts, after(el)}, total}
  const stage = api.stage;
  stage.innerHTML = '';
  const box = el('div');
  stage.appendChild(box);
  let i = 0, score = 0, correct = 0, locked = false;
  const total = cfg.count;
  if (cfg.total) api.setTimer(cfg.total, () => end());

  function end() {
    api.stopTimer();
    api.finish(score, { detail: `${correct} תשובות נכונות מתוך ${total}` });
  }
  function round() {
    if (i >= total) return end();
    locked = false;
    const r = cfg.make(i);
    api.status(`שאלה ${i + 1}/${total}`);
    box.innerHTML = '';
    if (r.sub) box.appendChild(el('p', 'g-title', r.sub));
    const q = el('div', 'g-q', r.q);
    box.appendChild(q);
    if (r.build) { r.build(box); }
    if (Store.item('hint') > 0) {
      const hb = el('button', 'btn ghost', `🔍 רמז 50:50 (${Store.item('hint')})`);
      hb.style.margin = '0 auto 12px';
      hb.style.display = 'flex';
      hb.onclick = () => {
        if (!Store.useItem('hint')) return;
        walletBump();
        const wrong = [];
        r.options.forEach((_, idx) => { if (idx !== r.answer) wrong.push(idx); });
        shuffle(wrong).slice(0, 2).forEach(idx => {
          const b = opts.children[idx];
          if (b) { b.classList.add('off'); b.disabled = true; b.style.opacity = '.3'; }
        });
        hb.remove();
        Sound.play('pop');
      };
      box.appendChild(hb);
    }
    const opts = el('div', 'opts');
    r.options.forEach((txt, idx) => {
      const b = el('button', 'opt', txt);
      b.onclick = () => {
        if (locked) return;
        locked = true;
        const ok = idx === r.answer;
        Array.from(opts.children).forEach((c, ci) => {
          if (ci === r.answer) c.classList.add('ok');
          else if (ci === idx) c.classList.add('no');
        });
        if (ok) { score += (r.pts || 10); correct++; api.setScore(score); api.sfx('good'); }
        else { api.sfx('bad'); }
        if (!ok) { box.classList.add('flashbad'); setTimeout(() => box.classList.remove('flashbad'), 450); }
        if (r.after) r.after(ok);
        i++;
        api.after(ok ? 620 : 950, round);
      };
      opts.appendChild(b);
    });
    box.appendChild(opts);
    if (r.footer) box.appendChild(r.footer);
  }
  round();
}

    <h3>${game.emoji} ${game.name}</h3>
    <ul class="howto">${game.howto.map((h, i) => `<li data-n="${i + 1}">${h}</li>`).join('')}</ul>
    <div class="scoring">🎯 ${game.scoring}</div>
    ${best ? `<div class="scoring" style="margin-top:-6px">🏅 השיא שלך: <b>${fmt(best)}</b></div>` : ''}
    <button class="btn wide" id="startBtn">▶︎ התחל לשחק</button>`;
  overlay.appendChild(sheet);
  stage.appendChild(overlay);

  const carryScore = Store.takeCarry(game.id);
  $('#startBtn', sheet).onclick = () => {
    Sound.unlock(); Sound.play('pop');
    overlay.remove();
    setScore(carryScore > 0 ? carryScore : 0);
    if (carryScore > 0) toast(`❤️ ממשיכים מ־${fmt(carryScore)} נקודות`);
    try { game.mount(stage, api); }
    catch (err) { console.error(err); stage.innerHTML = '<div class="g-note">שגיאה בטעינת המשחק. נסו שוב.</div>'; }
  };

  howBtn.onclick = () => { api.stopTimer(); cleanup(); renderGame(game); };

  function finish(finalScore, opts = {}) {
    if (finished) return;
    finished = true;
    cleanup();
    api.clearTimer();
    let s = Math.max(0, Math.round(finalScore == null ? score : finalScore));
    let doubled = false;
    if (s > 0 && Store.useItem('x2')) { s *= 2; doubled = true; }
    setScore(s);
    const rec = Store.save(game.id, s);
    const coins = coinsFor(s);
    if (coins > 0) Store.addCoins(coins);
    if (s > 0) Store.record({ game: game.id, name: Store.playerName() || 'אורח', title: game.name, emoji: game.emoji, cat: game.cat, score: s, ts: Date.now() });
    walletBump();
    const stars = s >= (game.gold || 120) ? 3 : s >= (game.silver || 60) ? 2 : s >= 1 ? 1 : 0;
    if (rec.isBest && s > 0) { Sound.play('win'); confetti(70); } else if (s > 0) Sound.play('great'); else Sound.play('lose');

    const list = gamesOf(game.cat);
    const idx = list.findIndex(g => g.id === game.id);
    const next = list[idx + 1];
    const res = el('div', 'overlay');
    const card = el('div', 'sheet');
    card.innerHTML = `
      <div class="result">
        <div class="medal">${stars === 3 ? '🏆' : stars === 2 ? '🥈' : stars === 1 ? '✨' : '💪'}</div>
        <h3>${opts.title || (s > 0 ? 'כל הכבוד!' : 'נסה שוב')}</h3>
        <div class="big-score">${fmt(s)}</div>
        <div class="sub">${opts.detail || 'נקודות בסבב הזה'}</div>
        <div class="sub">${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>
        ${rec.isBest && s > 0 ? '<div class="newbest">🏅 שיא חדש!</div>' : `<div class="sub" style="margin-top:8px">השיא שלך: ${fmt(rec.best)}</div>`}
        ${coins > 0 ? `<div class="coin-earn">🪙 +${fmt(coins)} מטבעות${doubled ? ' · ✨ ניקוד כפול הופעל' : ''}</div>` : `<div class="sub">${doubled ? '✨ ניקוד כפול הופעל' : 'אספו עוד נקודות כדי לזכות במטבעות'}</div>`}
        <div class="sub" style="margin-top:6px">יתרה: 🪙 ${fmt(Store.coins())} · ❤️ ${Store.lives()}</div>
        <div class="res-actions">
          ${Store.lives() > 0 && s > 0 ? `<button class="btn wide" id="reviveBtn">❤️ המשך מאותו ניקוד (${Store.lives()} חיים)</button>` : ''}
          <button class="btn ${Store.lives() > 0 && s > 0 ? 'ghost' : ''} wide" id="replayBtn">🔄 שחק שוב</button>
          ${next ? `<button class="btn ghost wide" id="nextBtn">המשך ל־${next.emoji} ${next.name} ←</button>` : ''}
          <button class="btn ghost wide" id="shopBtn">🛒 לחנות — קנו חיים ותוספת זמן</button>
          <button class="btn ghost wide" id="boardBtn2">🏅 טבלת ניקוד</button>
          <button class="btn ghost wide" id="shareBtn2">📲 שתף בוואטסאפ</button>
          <button class="btn ghost wide" id="catBtn">← חזרה לקטגוריה</button>
        </div>
      </div>`;
    res.appendChild(card);
    stage.appendChild(res);
    $('#replayBtn', card).onclick = () => { cleanup(); renderGame(game); };
    $('#shopBtn', card).onclick = () => { cleanup(); navigate('#/shop'); };
    $('#boardBtn2', card).onclick = () => { cleanup(); navigate('#/board'); };
    const rev = $('#reviveBtn', card);
    if (rev) rev.onclick = () => {
      if (!Store.useLife()) { toast('אין לכם חיים — אפשר לקנות בחנות'); navigate('#/shop'); return; }
      Store.setCarry(game.id, s);
      walletBump();
      Sound.play('great');
      cleanup(); renderGame(game);
    };
    $('#catBtn', card).onclick = () => { cleanup(); navigate('#/cat/' + game.cat); };
    $('#shareBtn2', card).onclick = () => shareWhatsApp(`השגתי ${fmt(s)} נקודות ב־${game.emoji} ${game.name}! תנצחו אותי:`);
    if (next) $('#nextBtn', card).onclick = () => { cleanup(); navigate('#/game/' + next.id); };
  }
  api.finish = finish;
}

/* שאלת אמריקאית: q4(נוסח, תשובה נכונה, [שלוש שגויות]) */
function q4(q, correct, wrongs, pts) {
  const opts = shuffle([correct].concat(wrongs.slice(0, 3)));
  return { q, options: opts, answer: opts.indexOf(correct), pts };
}

/* דגימה אקראית מתוך מאגר */
const sample = (arr, n) => shuffle(arr).slice(0, Math.min(n, arr.length));

/* משחק חידון מלא: מריץ את runQuiz עם מאגר שאלות */
function quizGame(def) {
  registerGame({
    id: def.id, cat: def.cat, name: def.name, emoji: def.emoji, desc: def.desc,
    howto: def.howto, scoring: def.scoring, diff: def.diff || 2,
    gold: def.gold || 900, silver: def.silver || 500,
    mount(stage, api) {
      const questions = def.pick ? def.pick() : def.questions;
      runQuiz(api, {
        count: questions.length,
        total: def.total,
        make: i => ({
          q: questions[i].q,
          options: questions[i].options,
          answer: questions[i].answer,
          pts: questions[i].pts || def.pts || 100
        })
      });
    }
  });
}

/* ===== מוח וחידות ===== */
(function () {

  /* 1. זיכרון זוגות */
  registerGame({

    scoring: '100 נקודות לזוג · 10− על טעות · בונוס מהירות עד 200',
    mount(stage, api) {
      const icons = ['🔥', '🎧', '🍕', '🚀', '🐙', '💎', '🎯', '🌵'];
      const deck = shuffle(icons.concat(icons));
      let open = [], matched = 0, misses = 0, score = 0, t0 = Date.now();
      stage.innerHTML = '';
      const grid = el('div', 'tiles');
      grid.style.gridTemplateColumns = 'repeat(4, minmax(58px, 78px))';
      stage.appendChild(grid);
      api.status('זוגות: 0/8');

      deck.forEach((ic, i) => {
        const t = el('button', 'tile', '');
        t.dataset.i = i;
        t.onclick = () => {
          if (t.classList.contains('face') || t.classList.contains('done') || open.length === 2) return;
          api.sfx('flip');
          t.classList.add('face'); t.textContent = ic;
          open.push({ t, ic });
          if (open.length === 2) {
            if (open[0].ic === open[1].ic) {
              const a = open[0].t, b = open[1].t;
              open = [];
              setTimeout(() => {
                a.classList.add('done'); b.classList.add('done');
                matched++; score += 100; api.setScore(score); api.sfx('good');
                api.status(`זוגות: ${matched}/8`);
                if (matched === 8) {
                  const secs = (Date.now() - t0) / 1000;
                  const bonus = Math.max(0, Math.round(200 - secs * 4));
                  api.finish(score + bonus, { detail: `8 זוגות ב־${Math.round(secs)} שניות · בונוס ${bonus}` });
                }
              }, 260);
            } else {
              misses++;
              const [a, b] = open;
              open = [];
              api.after(720, () => {
                [a, b].forEach(o => { o.t.classList.remove('face'); o.t.textContent = ''; });
              });
              score = Math.max(0, score - 10); api.setScore(score); api.sfx('bad');
              b.t.classList.add('bad');
              api.after(360, () => b.t.classList.remove('bad'));
            }
          }
        };
        grid.appendChild(t);
      });
    }
  });

  /* 2. סיימון */
  registerGame({
    id: 'brain.simon', cat: 'brain', name: 'סיימון', emoji: '🎛️', diff: 2, gold: 300, silver: 150,
    desc: 'חזרו על רצף הצלילים והצבעים שהולך ומתארך.',
    howto: ['המערכת מהבהבת רצף של צבעים עם צליל.', 'לאחר מכן חזרו על הרצף באותו סדר.', 'כל שלב מוסיף צליל אחד לרצף.', 'טעות אחת מסיימת את המשחק.'],
    scoring: '50 נקודות על כל שלב שהושלם',
    mount(stage, api) {
      const colors = ['#8b5cf6', '#3ad0ff', '#ff4d8d', '#ffb020'];
      const freqs = [329.63, 392, 440, 523.25];
      let seq = [], level = 0, input = [], busy = true;
      stage.innerHTML = '';
      const pads = el('div', 'simon-pads');
      const els = colors.map((c, i) => {
        const p = el('button', 'pad');
        p.style.background = `linear-gradient(145deg,${c},${c}aa)`;
        p.style.color = c;
        p.onclick = () => press(i);
        pads.appendChild(p);
        return p;
      });
      stage.appendChild(pads);
      const note = el('p', 'g-note', 'צפו ברצף…');
      stage.appendChild(note);

      function light(i, ms = 340) {
        els[i].classList.add('lit');
        api.note(freqs[i], 0, .3, 'sine', .24);
        api.after(ms * .7, () => els[i].classList.remove('lit'));
      }
      function playSeq() {
        busy = true;
        note.textContent = `שלב ${level} · צפו ברצף…`;
        api.status(`שלב ${level}`);
        seq.forEach((v, k) => api.after(480 * k + 420, () => light(v)));
        api.after(480 * seq.length + 420, () => { busy = false; input = []; note.textContent = 'עכשיו תורכם — חזרו על הרצף'; });
      }
      function nextLevel() {
        level++;
        seq.push(rnd(4));
        api.setScore((level - 1) * 50);
        playSeq();
      }
      function press(i) {
        if (busy) return;
        light(i, 220);
        input.push(i);
        const k = input.length - 1;
        if (input[k] !== seq[k]) {
          els[i].classList.add('bad');
          api.sfx('lose');
          api.after(450, () => els[i].classList.remove('bad'));
          note.textContent = 'טעות! הרצף הסתיים.';
          api.after(700, () => api.finish(Math.max(0, (level - 1) * 50), { detail: `הגעת לשלב ${level}` }));
          busy = true;
          return;
        }
        if (input.length === seq.length) {
          api.sfx('great');
          busy = true;
          note.textContent = 'מעולה! עוד צליל…';
          api.after(900, nextLevel);
        }
      }
      api.after(500, nextLevel);

  registerGame({

    scoring: '10 נקודות לשאלה נכונה · 12 שאלות · 60 שניות',
    mount(stage, api) {
      const gen = () => {
        const kind = rnd(3);
        let a, b, q, ans;
        if (kind === 0) { a = rndInt(11, 89); b = rndInt(11, 99); q = `${a} + ${b}`; ans = a + b; }
        else if (kind === 1) { a = rndInt(40, 99); b = rndInt(11, a - 5); q = `${a} − ${b}`; ans = a - b; }
        else { a = rndInt(3, 12); b = rndInt(3, 12); q = `${a} × ${b}`; ans = a * b; }
        const set = new Set([ans]);
        while (set.size < 4) {
          const d = ans + pick([-11, -9, -6, -3, -2, 2, 3, 6, 9, 11, 18]);
          if (d > 0 && d !== ans) set.add(d);

        c.onclick = () => {
          if (values[i]) return;

          cells.forEach(x => x.classList.remove('sel'));
          sel = i; c.classList.add('sel');
        };
        cells.push(c); grid.appendChild(c);
        if ((i % 4) === 1) c.style.marginInlineEnd = '10px';
        if (Math.floor(i / 4) === 1) c.style.marginBottom = '10px';
      });
      stage.appendChild(grid);

      const pad = el('div', 'row');
      pad.style.marginTop = '16px';
      for (let n = 1; n <= 4; n++) {
        const b = el('button', 'btn ghost', String(n));
        b.style.minWidth = '58px';
        b.onclick = () => {
          if (sel < 0) { toast('בחרו משבצת ריקה קודם'); return; }
          const i = sel;
          if (values[i]) return;
          if (sol[Math.floor(i / 4)][i % 4] === n) {
            values[i] = n;
            cells[i].textContent = n;
            cells[i].classList.remove('sel');
            cells[i].style.opacity = '1';
            cells[i].style.background = 'linear-gradient(145deg,#1c6b53,#22d3a5)';
            cells[i].style.color = '#04120d';
            score += 10; api.setScore(score); api.sfx('good');
            sel = -1; left--;
            api.status(`נותרו ${left} משבצות`);
            if (left === 0) {
              api.sfx('win');
              api.finish(score + 120, { detail: `לוח מלא! ${errors} טעויות · בונוס 120` });
            }
          } else {
            errors++;
            cells[i].classList.add('bad');
            api.after(380, () => cells[i].classList.remove('bad'));
            score = Math.max(0, score - 5); api.setScore(score); api.sfx('bad');
          }
        };
        pad.appendChild(b);
      }
      stage.appendChild(pad);
      stage.appendChild(el('p', 'g-note', 'רמז: כל שורה, עמודה וריבוע 2×2 מכילים 1–4 בלי כפילות'));
      api.status(`נותרו ${left} משבצות`);
    }
  });

})();

      let rocks = [], alive = true, t0 = performance.now(), last = t0, score = 0, killed = false;

      const movePointer = e => {
        const r = cv.getBoundingClientRect();

      };

      };
      window.addEventListener('keydown', keyH);

      const loop = now => {
        if (!alive) return;

        ctx.fillStyle = 'rgba(255,255,255,.22)';
        for (let i = 0; i < 26; i++) {
          const sx = (i * 137 + elapsed * 40) % cv.width, sy = (i * 71 + elapsed * 90) % cv.height;
          ctx.fillRect(sx, sy, 2, 2);
        }
        const rate = Math.min(0.55, 0.18 + elapsed * 0.014);
        if (Math.random() < rate) rocks.push({ x: rndInt(20, cv.width - 20), y: -18, r: rndInt(9, 20), v: rndInt(150, 300) });
        rocks.forEach(o => { o.y += o.v * dt; });
        rocks = rocks.filter(o => o.y < cv.height + 30);

        ctx.fillStyle = 'rgba(255,120,80,.92)';
        rocks.forEach(o => {
          ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2); ctx.fill();
        });
        // player
        const grad = ctx.createLinearGradient(P.x - 20, 0, P.x + 20, 0);
        grad.addColorStop(0, '#3ad0ff'); grad.addColorStop(1, '#8b5cf6');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(P.x, P.y - 14);
        ctx.lineTo(P.x + P.w / 2, P.y + P.h / 2);
        ctx.lineTo(P.x - P.w / 2, P.y + P.h / 2);
        ctx.closePath(); ctx.fill();

        const hit = rocks.find(o => o.y + o.r > P.y - 14 && o.y - o.r < P.y + 10 && Math.abs(o.x - P.x) < (P.w / 2 + o.r * .8));
        if (hit) {
          alive = false; killed = true;
          api.sfx('lose'); confetti(0);
          api.finish(Math.round(elapsed * 5), { detail: `שרדתם ${Math.round(elapsed)} שניות` });
          return;
        }
        requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);
      api.status('30s · 0s שרדתם');
    }
  });
})();


/* ===== games-words.js ===== */
/* ===== מילים ושפה ===== */
(function () {

  const FINALS = { 'ך': 'כ', 'ם': 'מ', 'ן': 'נ', 'ף': 'פ', 'ץ': 'צ' };
  const norm = ch => FINALS[ch] || ch;
  const ALPHABET = ['א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ז', 'ח', 'ט', 'י', 'כ', 'ל', 'מ', 'נ', 'ס', 'ע', 'פ', 'צ', 'ק', 'ר', 'ש', 'ת'];

  /* 1. תלי תלוי */
  registerGame({
    id: 'words.hangman', cat: 'words', name: 'תלי תלוי', emoji: '🪢', diff: 2, gold: 700, silver: 400,
    desc: 'נחשו את המילה הנסתרת אות אחר אות, לפני שנגמרים הניסיונות.',
    howto: [
      'מוצגת מילה חסרה — קו לכל אות.',
      'לוחצים על אותיות במקלדת שמתחת למילה.',
      'אות נכונה נחשפת ומוסיפה 40 נקודות.',
      'שש טעיות מסיימות את המשחק עם הניקוד שנצבר.'
    ],
    scoring: '40 נקודות לאות נכונה · 200 בונוס על פתרון מילה',
    mount(stage, api) {
      const WORDS = ['מחשב', 'שמש', 'פיל', 'מטריה', 'תפוח', 'כוכב', 'מכונית', 'גיטרה', 'חלון', 'ארנב',
        'מגדל', 'שוקולד', 'כדורגל', 'מזוודה', 'ענן', 'חוף', 'תמונה', 'מפתח', 'חורף', 'גמל',
        'מסעדה', 'טלפון', 'ספריה', 'שוק', 'ירח', 'נמר', 'ארמון', 'פסנתר'];
      const FACES = ['😀', '🙂', '😐', '😟', '😰', '😵'];
      const TOTAL = 3;
      let round = 0, score = 0, solved = 0;

      const nextWord = () => {
        if (round >= TOTAL) {
          return api.finish(score, { detail: `${solved} מילים מתוך ${TOTAL} · ${round - solved} נכשלו` });
        }
        round++;
        const word = pick(WORDS);
        const chars = [...word];
        const need = new Set(chars.map(norm));
        const guessed = new Set();
        let misses = 0;

        stage.innerHTML = '';
        const wrap = el('div', 'pad-wrap');
        wrap.style.flexDirection = 'column';
        wrap.style.gap = '16px';
        const face = el('div', '', FACES[0]);
        face.style.cssText = 'font-size:44px;line-height:1';
        const slots = el('div', '');
        slots.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:26px;font-weight:800;direction:rtl';
        const note = el('div', 'small-note');
        const kbd = el('div', '');
        kbd.style.cssText = 'display:grid;grid-template-columns:repeat(6,1fr);gap:8px;max-width:460px;width:100%';
        wrap.appendChild(face); wrap.appendChild(slots); wrap.appendChild(note); wrap.appendChild(kbd);
        stage.appendChild(wrap);

        const drawSlots = () => {
          slots.innerHTML = '';
          chars.forEach(ch => {
            const cell = el('span', '', guessed.has(norm(ch)) || ch === ' ' ? ch : '•');
            cell.style.cssText = 'min-width:26px;text-align:center;border-bottom:3px solid currentColor;padding-bottom:2px;opacity:' + (guessed.has(norm(ch)) ? '1' : '.55');
            slots.appendChild(cell);
          });
        };
        const drawNote = () => {
          note.textContent = `מילה ${round}/${TOTAL} · טעיות ${misses}/6 · ניקוד ${fmt(score)}`;
        };

        const checkSolved = () => [...need].every(l => guessed.has(l));

        ALPHABET.forEach(letter => {
          const b = el('button', 'chip', letter);
          b.style.cssText = 'font-size:17px;padding:10px 0;font-weight:700';
          b.onclick = () => {
            if (b.disabled) return;
            b.disabled = true;
            b.style.opacity = '.35';
            if (need.has(letter)) {
              guessed.add(letter);
              score += 40;
              api.setScore(score);
              api.sfx('good');
              drawSlots(); drawNote();
              if (checkSolved()) {
                solved++;
                score += 200;
                api.setScore(score);
                api.sfx('win');
                note.textContent = `פתרתם את "${word}"! ‎+200`;
                api.after(900, nextWord);
              }
            } else {
              misses++;
              api.sfx('bad');
              face.textContent = FACES[Math.min(misses, FACES.length - 1)];
              drawNote();
              if (misses >= 6) {
                slots.innerHTML = `<span style="font-size:20px">המילה הייתה: ${word}</span>`;
                api.after(1200, () => api.finish(score, { detail: `המילה "${word}" לא נפתרה · ${solved} מילים נפתרו` }));
              }
            }
          };
          kbd.appendChild(b);
        });

        drawSlots(); drawNote();
        api.status(`מילה ${round}/${TOTAL}`);
      };
      nextWord();
    }
  });

  /* 2. אנגרמות */
  registerGame({
    id: 'words.anagram', cat: 'words', name: 'אנגרמות', emoji: '🔤', diff: 2, gold: 800, silver: 450,
    desc: 'האותיות התערבבו — הרכיבו מהן את המילה הנכונה.',
    howto: [
      'מוצגות אותיות מעורבבות של מילה אחת.',
      'לוחצים על האותיות לפי הסדר שבו הן נכתבות.',
      'מילה נכונה מוסיפה 120 נקודות ועוברת למילה הבאה.',
      'מילה שגויה מורידה 30 נקודות ומאפסת את הבנייה.'
    ],

    mount(stage, api) {

(function () {

  const numOpts = (correct, spread) => {
    const set = new Set([correct]);
    let guard = 0;
    while (set.size < 4 && guard++ < 60) {
      const delta = rndInt(1, spread) * (Math.random() < .5 ? -1 : 1);
      const v = correct + delta;
      if (v >= 0) set.add(v);
    }
    const opts = shuffle([...set]);
    return { options: opts.map(String), answer: opts.indexOf(correct) };
  };

  /* 1. מה גדול יותר */
  quizGame({

    ],
    scoring: '110 נקודות לתשובה נכונה',
    pick() {
      const out = [];
      for (let i = 0; i < 10; i++) {
        let a, b, c, d, va, vb;
        do {
          a = rndInt(2, 12); b = rndInt(2, 9);
          c = rndInt(2, 12); d = rndInt(2, 9);
          va = a * b; vb = c * d;
        } while (va === vb);
        const q = `איזה ביטוי גדול יותר?`;
        const opts = [`${a} × ${b}`, `${c} × ${d}`];
        out.push({ q, options: opts, answer: va > vb ? 0 : 1, pts: 110 });
      }
      return out;
    }
  });

  /* 2. לוח הכפל */
  quizGame({

      const out = [];
      for (let i = 0; i < 12; i++) {
        const a = rndInt(2, 10), b = rndInt(2, 10);
        const correct = a * b;
        const o = numOpts(correct, 12);
        out.push({ q: `${a} × ${b} = ?`, options: o.options, answer: o.answer });
      }
      return out;
    }
  });

  /* 3. סדרות מספרים */

    id: 'numbers.series', cat: 'numbers', name: 'סדרות חשבוניות', emoji: '🔗', diff: 2, gold: 900, silver: 500,

    pick() {
      const out = [];

        const start = rndInt(1, 20);
        const step = rndInt(2, 9);
        const seq = [start, start + step, start + step * 2, start + step * 3];
        const correct = start + step * 4;
        const o = numOpts(correct, step * 3);
        out.push({ q: `מהו המספר הבא? ${seq.join(' , ')} , ___`, options: o.options, answer: o.answer });
      }
      return out;
    }
  });

  /* 4. חילוק */

        out.push({ q: `${a} ÷ ${b} = ?`, options: o.options, answer: o.answer });

    mount(stage, api) {
      let score = 0, sum = 0, target = 0, hits = 0, cleared = false;

        sum = 0;

        head.textContent = `המטרה: ${target} · פגיעות: ${hits}`;
        grid.innerHTML = '';
        const nums = [];
        while (nums.length < 9) {
          const v = rndInt(1, Math.max(9, Math.ceil(target / 3)));
          nums.push(v);
        }
        if (!nums.includes(target)) nums[rnd(9)] = target;
        shuffle(nums).forEach(v => {

        if (cleared) return;
        cleared = true;
        api.finish(score, { detail: `${hits} מטרות שהושגו` });

      stage.innerHTML = '';

      const ground = el('div', '');
      ground.style.cssText = 'position:absolute;left:0;right:0;bottom:0;height:6px;background:rgba(255,255,255,.25)';

      runner.textContent = '🏃';
      runner.style.cssText = 'position:absolute;bottom:8px;right:16px;font-size:34px;transition:bottom .16s ease';

      wrap.style.flexDirection = 'column';
      wrap.style.gap = '10px';

        if (over || jumping) return;
        jumping = true;
        runner.style.bottom = '78px';
        api.sfx('tap');
        setTimeout(() => { runner.style.bottom = '8px'; jumping = false; }, 380);
      };
      track.onclick = jump;
      const keyH = e => { if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); } };
      window.addEventListener('keydown', keyH);
      api.onCleanup(() => window.removeEventListener('keydown', keyH));

      api.every(30, () => {
        if (over || cleared) return;
        spawn += 30;
        if (spawn > 1000 - speed * 60) {
          spawn = 0;
          const h = el('div', '');
          h.textContent = '🚧';
          h.style.cssText = 'position:absolute;bottom:8px;right:-40px;font-size:28px';
          h._x = -6;
          track.appendChild(h);
          hurdles.push(h);
        }
        hurdles.forEach(h => {
          h._x += speed;
          h.style.right = h._x + '%';
          if (!h._done && h._x > 62) {
            h._done = true;
            if (!jumping) {
              over = true;
              api.sfx('bad');
              api.finish(score, { detail: `נפלתם במשוכה ${passed + 1} · ${passed} משוכות עברו` });
            } else {
              passed++;
              score += 100;
              api.setScore(score);
              api.sfx('good');
              hint.textContent = `משוכות: ${passed} · ${fmt(score)} נקודות`;
              if (speed < 6) speed += 0.09;
            }
          }
          if (h._x > 120) { h.remove(); }
        });
        hurdles = hurdles.filter(h => h.parentNode);
      });

      api.setTimer(30, () => {
        if (cleared || over) return;
        cleared = true;
        const bonus = passed >= 20 ? 200 : 0;
        api.finish(score + bonus, { detail: `${passed} משוכות בשלום${bonus ? ' · בונוס 200' : ''}` });
      });
      api.onCleanup(() => { cleared = true; });
      api.status('קפצו מעל המשוכות');
    }
  });

})();

    howto: [
      'מוצג שם מתכון וחמישה שלבים מעורבבים.',

    ],
    scoring: '80 נקודות לשלב נכון · 200 בונוס על מתכון שלם · 20− לטעות',
    mount(stage, api) {
      const RECIPES = [
        { name: 'חביתה', steps: ['טורפים ביצים עם מלח', 'מחממים שמן במחבת', 'יוצקים את הביצים', 'מקפלים כשהקצוות מתייצבים', 'מגישים חם'] },
        { name: 'סלט ירקות', steps: ['שוטפים את הירקות', 'חותכים לקוביות', 'מעבירים לקערה', 'מוסיפים שמן זית ולימון', 'מערבבים ומגישים'] },
        { name: 'פסטה ברוטב עגבניות', steps: ['מרתיחים מים בסיר', 'מוסיפים מלח ושמן', 'מבשלים את הפסטה', 'מחממים את הרוטב במחבת', 'מערבבים את הפסטה ברוטב'] },
        { name: 'שוקו חם', steps: ['מחממים חלב בסיר', 'מוסיפים קקאו', 'מוסיפים סוכר', 'מערבבים עד המסה', 'מוזגים לכוס'] },
        { name: 'טוסט גבינה', steps: ['מוציאים שתי פרוסות לחם', 'מורחים חמאה', 'שמים גבינה בין הפרוסות', 'מחממים במצנם או במחבת', 'חותכים ומגישים'] }
      ];
      const TOTAL = 3;
      const list = sample(RECIPES, TOTAL);
      let round = 0, score = 0, done = 0;

      const startRecipe = () => {
        if (round >= TOTAL) return api.finish(score, { detail: `${done} מתכונים בסדר נכון מתוך ${TOTAL}` });
        const recipe = list[round];
        round++;
        let step = 0;

        stage.innerHTML = '';
        const wrap = el('div', 'pad-wrap');
        wrap.style.flexDirection = 'column';
        wrap.style.gap = '14px';
        const title = el('div', 'g-title', `מתכון ${round}/${TOTAL} · ${recipe.name}`);
        const solved = el('div', '');
        solved.style.cssText = 'display:flex;flex-direction:column;gap:6px;min-height:40px;font-size:15px;opacity:.9';
        const pool = el('div', '');
        pool.style.cssText = 'display:flex;flex-direction:column;gap:8px;width:100%;max-width:420px';
        const note = el('div', 'small-note');
        wrap.appendChild(title); wrap.appendChild(solved); wrap.appendChild(pool); wrap.appendChild(note);
        stage.appendChild(wrap);

        const steps = shuffle(recipe.steps.map((text, i) => ({ text, i })));
        steps.forEach(s => {
          const b = el('button', 'chip', s.text);
          b.style.cssText = 'padding:12px 14px;font-size:15px;text-align:right;font-weight:600';
          b.onclick = () => {
            if (b.disabled) return;
            if (s.i === step) {
              b.disabled = true;
              b.style.opacity = '.45';
              step++;
              score += 80;
              api.setScore(score);
              api.sfx('good');
              const line = el('div', '', `${step}. ${s.text}`);
              line.style.cssText = 'padding:6px 10px;border-radius:9px;background:rgba(34,211,165,.18)';
              solved.appendChild(line);
              note.textContent = `שלב ${step}/5 · ${fmt(score)} נקודות`;
              if (step === recipe.steps.length) {
                done++;
                score += 200;
                api.setScore(score);
                api.sfx('win');
                note.textContent = 'המתכון מוכן! ‎+200';
                api.after(850, startRecipe);
              }
            } else {
              score = Math.max(0, score - 20);

/* ===== games-cook2.js ===== */
/* ===== סדנת בישול · מנוע הכנה אמיתי (גרירה, מריחה, גלגול, חיתוך, תזמון) ===== */
(function () {
  const mk = (css, html) => { const n = document.createElement('div'); if (html != null) n.innerHTML = html; n.style.cssText = css; return n; };

  function cookSim(def) {
    return function (stage, api) {
      stage.innerHTML = '';
      let score = 0, idx = 0, mistakes = 0, busy = false;

      const root = mk('display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;touch-action:none;-webkit-user-select:none;user-select:none');
      const hud = el('div', 'hud');
      const hint = el('div', 'g-title');
      hint.style.cssText = 'min-height:22px;text-align:center;font-size:15px;opacity:.9';
      const station = mk('position:relative;width:min(84vw,330px);height:min(84vw,330px);border-radius:26px;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.11),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.16);overflow:hidden;touch-action:none;flex:none');
      const tray = mk('display:flex;gap:12px;justify-content:center;flex-wrap:wrap;min-height:76px;align-items:center');
      root.append(hud, hint, station, tray);
      stage.appendChild(root);

      const paintHud = () => {
        hud.innerHTML = `<span class="pill">שלב <b>${Math.min(idx + 1, def.steps.length)}</b>/${def.steps.length}</span><span class="pill">🏆 <b>${score}</b></span>`;
      };
      paintHud();

      const addLayer = (txt, o = {}) => {
        const n = mk(`position:absolute;left:${(o.x == null ? .5 : o.x) * 100}%;top:${(o.y == null ? .5 : o.y) * 100}%;transform:translate(-50%,-50%) scale(.5) rotate(${o.rot || 0}deg);font-size:${o.size || 54}px;opacity:0;transition:.35s;pointer-events:none;z-index:${o.z || 1}`, txt);
        station.appendChild(n);
        requestAnimationFrame(() => { n.style.opacity = 1; n.style.transform = `translate(-50%,-50%) scale(1) rotate(${o.rot || 0}deg)`; });
        return n;
      };

      const shake = () => {
        station.style.transition = 'transform .08s';
        station.style.transform = 'translateX(-6px)';
        setTimeout(() => { station.style.transform = 'translateX(6px)'; }, 80);
        setTimeout(() => { station.style.transform = 'translateX(0)'; }, 160);
      };

      const reward = (pts) => { score += Math.max(20, Math.round(pts)); api.setScore(score); paintHud(); api.sfx('win'); };

      const finishDish = () => {
        if (def.final) addLayer(def.final, { size: 92, z: 9 });
        tray.innerHTML = '';
        hint.textContent = `${def.name} מוכן! 🎉`;
        api.sfx('win');
        api.after(700, () => api.finish(score + Math.max(0, 200 - mistakes * 40), { detail: `${def.name} · ${mistakes} טעויות` }));
      };

      const next = () => { idx++; busy = false; if (idx >= def.steps.length) return finishDish(); run(); };

      /* ---- גרירה ---- */
      function dragStep(s) {
        const chip = mk('display:flex;align-items:center;gap:6px;padding:12px 18px;border-radius:18px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);font-weight:700;font-size:15px;cursor:grab;touch-action:none',
          `<span style="font-size:26px">${s.item.emoji}</span><span>${s.item.label || ''}</span>`);
        tray.appendChild(chip);
        let dragging = false, ghost = null;
        const move = (e) => { if (ghost) { ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px'; } };
        const down = (e) => {
          if (busy) return;
          e.preventDefault();
          dragging = true; busy = true;
          chip.style.opacity = .4;
          ghost = mk('position:fixed;font-size:44px;pointer-events:none;z-index:9999;transform:translate(-50%,-50%)');
          ghost.textContent = s.item.emoji;
          document.body.appendChild(ghost);
          move(e);
        };
        const up = (e) => {
          if (!dragging) return;
          dragging = false; busy = false;
          if (ghost) { ghost.remove(); ghost = null; }
          chip.style.opacity = 1;
          const r = station.getBoundingClientRect();
          const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
          const t = s.drop || { x: .5, y: .5, r: .32 };
          const d = Math.hypot(x - t.x, y - t.y);
          const r0 = t.r || .32;
          if (d <= r0 + .14) {
            chip.remove();
            addLayer(s.visual || s.item.emoji, { size: s.size, x: t.x, y: t.y, z: s.z, rot: s.rot });
            reward(d <= r0 ? (s.points || 100) : Math.round((s.points || 100) * .6));
            hint.textContent = d <= r0 ? (s.ok || 'מעולה!') : 'קרוב מספיק — אבל אפשר מדויק יותר';
            api.after(420, next);
          } else {
            mistakes++; api.sfx('bad'); shake();
            hint.textContent = s.fail || 'כמעט — הניחו במרכז הכלי';
          }
        };
        chip.addEventListener('pointerdown', down);
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
        api.onCleanup(() => {
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
          if (ghost) ghost.remove();
        });
      }

      /* ---- מריחה ---- */
      function paintStep(s) {
        const cols = 8, total = cols * cols;
        const grid = mk(`position:absolute;inset:0;display:grid;grid-template-columns:repeat(${cols},1fr);touch-action:none;z-index:2`);
        const cells = [];
        for (let i = 0; i < total; i++) {
          const c = mk('background:transparent;transition:background .18s');
          grid.appendChild(c); cells.push(c);
        }
        station.appendChild(grid);
        let filled = 0, finished = false;
        const paint = (e) => {
          if (finished) return;
          const r = grid.getBoundingClientRect();
          const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
          if (x < 0 || x > 1 || y < 0 || y > 1) return;
          const cx = Math.floor(x * cols), cy = Math.floor(y * cols);
          for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
            const px = cx + dx, py = cy + dy;
            if (px < 0 || py < 0 || px >= cols || py >= cols) continue;
            const cell = cells[py * cols + px];
            if (cell.dataset.f) continue;
            cell.dataset.f = '1';
            cell.style.background = s.color || 'rgba(255,140,140,.6)';
            filled++;
          }
          const pct = filled / total;
          hint.textContent = `${s.label || 'מורחים'} · ${Math.round(pct * 100)}%`;
          if (pct >= (s.coverage || .55)) {
            finished = true;
            reward(s.points || 130);
            hint.textContent = s.ok || 'מיושר ושטוח 👌';
            api.after(200, () => grid.remove());
            api.after(320, next);
          }
        };
        grid.addEventListener('pointerdown', (e) => { paint(e); grid.dataset.down = '1'; });
        grid.addEventListener('pointermove', (e) => { if (grid.dataset.down === '1') paint(e); });
        const release = () => { grid.dataset.down = '0'; };
        window.addEventListener('pointerup', release);
        api.onCleanup(() => window.removeEventListener('pointerup', release));
      }

      /* ---- גרירה מהירה (גלגול / חיתוך / קיפול) ---- */
      function swipeStep(s) {
        const need = s.count || 1;
        let done = 0, start = null;
        const pad = mk('position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:70px;touch-action:none;z-index:3');
        pad.textContent = s.icon || '✋';
        station.appendChild(pad);
        const down = (e) => { start = { x: e.clientX, y: e.clientY }; };
        const up = (e) => {
          if (!start) return;
          const dx = e.clientX - start.x, dy = e.clientY - start.y;
          start = null;
          const okDir = (s.dir === 'up' && dy < -50 && Math.abs(dy) > Math.abs(dx))
            || (s.dir === 'down' && dy > 50 && Math.abs(dy) > Math.abs(dx))
            || (s.dir === 'right' && dx > 50 && Math.abs(dx) > Math.abs(dy))
            || (s.dir === 'left' && dx < -50 && Math.abs(dx) > Math.abs(dy));
          if (!okDir) { hint.textContent = s.fail || 'גררו בכיוון הנכון'; api.sfx('tap'); return; }
          done++;
          api.sfx('pop');
          hint.textContent = `${s.label || 'מבצע'} · ${done}/${need}`;
          reward((s.points || 120) / need);
          if (done >= need) {
            if (s.visual) addLayer(s.visual, { size: s.size || 70, z: 5 });
            pad.remove();
            api.after(320, next);
          }
        };
        pad.addEventListener('pointerdown', down);
        window.addEventListener('pointerup', up);
        api.onCleanup(() => window.removeEventListener('pointerup', up));
      }

      /* ---- החזקה ---- */
      function holdStep(s) {
        const ms = s.ms || 1400;
        const wrap = mk('position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:3');
        const btn = mk('width:150px;height:150px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:64px;background:rgba(255,255,255,.10);border:3px solid rgba(255,255,255,.25);touch-action:none;position:relative;overflow:hidden');
        btn.textContent = s.icon || '👆';
        const fill = mk('position:absolute;left:0;bottom:0;width:100%;height:0%;background:rgba(120,255,180,.35);transition:height .1s');
        btn.appendChild(fill);
        wrap.appendChild(btn); station.appendChild(wrap);
        let t0 = 0, raf = null, ok = false;
        const tick = () => {
          const p = Math.min(1, (Date.now() - t0) / ms);
          fill.style.height = (p * 100) + '%';
          hint.textContent = `${s.label || 'מחזיקים'} · ${Math.round(p * 100)}%`;
          if (p >= 1) { finish(); return; }
          raf = requestAnimationFrame(tick);
        };
        const finish = () => {
          if (ok) return; ok = true;
          cancelAnimationFrame(raf);
          reward(s.points || 140);
          if (s.visual) addLayer(s.visual, { size: s.size || 64, z: 4 });
          wrap.remove();
          hint.textContent = s.ok || 'מושלם!';
          api.after(320, next);
        };
        const down = (e) => { e.preventDefault(); t0 = Date.now(); tick(); };
        const up = () => {
          if (ok) return;
          cancelAnimationFrame(raf);
          fill.style.height = '0%';
          if (t0) { hint.textContent = s.fail || 'החזיקו עד הסוף בלי לשחרר'; t0 = 0; }
        };
        btn.addEventListener('pointerdown', down);
        window.addEventListener('pointerup', up);
        api.onCleanup(() => { cancelAnimationFrame(raf); window.removeEventListener('pointerup', up); });
      }

      /* ---- תזמון ---- */
      function timingStep(s) {
        const wrap = mk('display:flex;flex-direction:column;gap:12px;align-items:center;width:min(84vw,330px)');
        const bar = mk('position:relative;width:100%;height:22px;border-radius:12px;background:rgba(255,255,255,.12);overflow:hidden');
        const zone = mk('position:absolute;top:0;bottom:0;left:40%;width:20%;background:rgba(110,240,160,.35)');
        const mark = mk('position:absolute;top:-4px;bottom:-4px;width:5px;border-radius:3px;background:#fff;left:0');
        bar.append(zone, mark);
        const go = el('button', 'btn', s.button || 'עצרו בזמן!');
        wrap.append(bar, go); tray.appendChild(wrap);
        let pos = 0, dir = 1, iv = null;
        iv = setInterval(() => {
          pos += dir * 2.4;
          if (pos > 100) { pos = 100; dir = -1; }
          if (pos < 0) { pos = 0; dir = 1; }
          mark.style.left = pos + '%';
        }, 16);
        api.onCleanup(() => clearInterval(iv));
        go.onclick = () => {
          clearInterval(iv);
          const d = Math.abs(pos - 50);
          if (d <= 8) reward(180);
          else if (d <= 18) reward(120);
          else { reward(40); mistakes++; api.sfx('bad'); }
          if (s.visual) addLayer(s.visual, { size: s.size || 64, z: 4 });
          tray.innerHTML = '';
          hint.textContent = d <= 8 ? 'בול! 🔥' : d <= 18 ? 'טוב מאוד' : 'קצת נשרף…';
          api.after(400, next);
        };
      }

      const run = () => {
        if (busy) return;
        const s = def.steps[idx];
        tray.innerHTML = '';
        hint.textContent = s.hint || '';
        paintHud();
        if (s.type === 'drag') dragStep(s);
        else if (s.type === 'paint') paintStep(s);
        else if (s.type === 'swipe') swipeStep(s);
        else if (s.type === 'hold') holdStep(s);
        else if (s.type === 'timing') timingStep(s);
        else next();
      };

      run();
    };
  }

  window.cookSim = cookSim;
})();
